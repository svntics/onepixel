  <main id="contenido" class="mx-auto max-w-xl px-4 pb-10 outline-none" tabindex="-1">

    <!-- ===== Elegir liga ===== -->
    <section id="fp-leagues" aria-labelledby="fp-title">
      <h1 id="fp-title" class="mt-6 text-2xl font-extrabold leading-tight sm:text-3xl">🧩 4 Fotos 1 Equipo</h1>
      <p class="mt-2 text-muted">Cuatro fotos esconden a un club: sus colores, su ciudad, su apodo y su cultura. Arma su nombre con las letras. Elige una liga:</p>
      <p class="fp-stats mt-3 text-sm text-muted" aria-live="polite"></p>
      <ul id="fp-league-list" class="mt-6 grid gap-3 sm:grid-cols-2" role="list"></ul>
    </section>

    <!-- ===== Juego ===== -->
    <section id="fp-game" aria-labelledby="fp-league-name">
      <div class="mt-4 flex items-center justify-between gap-2">
        <a href="#/" class="min-h-11 inline-flex items-center text-sm font-semibold text-muted hover:text-text">← Ligas</a>
        <p class="fp-stats text-sm text-muted" aria-live="polite"></p>
      </div>
      <h1 id="fp-league-name" class="text-xl font-extrabold"></h1>

      <div id="fp-photos" class="mt-3 grid grid-cols-2 gap-2"></div>

      <div id="fp-board" class="mt-4">
        <div id="fp-slots" class="flex flex-wrap justify-center gap-x-4 gap-y-2" aria-label="Respuesta"></div>
        <p id="fp-msg" class="mt-2 min-h-6 text-center text-sm font-semibold" role="status" aria-live="polite"></p>
        <div id="fp-bank" class="mx-auto mt-2 grid max-w-sm grid-cols-6 gap-1.5" aria-label="Letras disponibles"></div>
        <div class="mt-4 flex justify-center gap-2">
          <button id="fp-clear" type="button" class="min-h-11 rounded-xl border border-border bg-surface px-4 text-sm font-semibold hover:bg-surface-2">Borrar todo</button>
          <button id="fp-giveup" type="button" class="min-h-11 rounded-xl border border-border bg-surface px-4 text-sm font-semibold hover:bg-surface-2">Rendirse</button>
        </div>
      </div>

      <div id="fp-result" class="mt-4 outline-none" tabindex="-1" hidden>
        <div class="rounded-2xl border border-border bg-surface p-4 text-center">
          <p id="fp-result-title" class="pix text-2xl font-extrabold"></p>
          <p id="fp-result-detail" class="mt-1 text-muted"></p>
          <button id="fp-next" type="button" class="mt-4 min-h-11 rounded-xl bg-accent px-5 font-bold text-accent-ink">Siguiente equipo →</button>
        </div>
        <details id="fp-why" class="mt-4 rounded-2xl border border-border bg-surface p-4" open>
          <summary class="cursor-pointer font-bold"></summary>
          <ol id="fp-why-list" class="mt-3 grid gap-3" role="list"></ol>
        </details>
      </div>
    </section>
  </main>

  <dialog id="fp-zoom" class="m-auto max-w-[min(92vw,32rem)] rounded-2xl border border-border bg-surface p-2 text-text backdrop:bg-black/70">
    <img id="fp-zoom-img" alt="" class="block w-full rounded-xl">
    <form method="dialog" class="mt-2 text-center"><button class="min-h-11 rounded-xl border border-border px-4 text-sm font-semibold">Cerrar</button></form>
  </dialog>

  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-6 z-50 mx-auto w-fit rounded-xl bg-text px-4 py-2 text-sm font-semibold text-bg opacity-0 transition-opacity" role="status" aria-live="polite"></div>
